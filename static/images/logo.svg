<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" fill="none">
  <!-- Gradients -->
  <defs>
    <!-- Blue Gradient for S body -->
    <linearGradient id="s-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- Bar chart gradients -->
    <linearGradient id="bar-g" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="bar-y" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="bar-r" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
  </defs>

  <!-- Main S Logo Group -->
  <g class="state-s">
    <!-- S Background curved path -->
    <path class="s-body" d="M210,75 C180,45 130,55 110,85 C90,115 110,150 150,160 C190,170 210,195 200,225 C190,255 140,265 95,245 C90,235 110,230 120,225 C145,210 170,215 175,195 C180,175 160,155 130,145 C100,135 75,110 85,80 C95,50 145,30 200,45 C205,50 208,65 210,75 Z" fill="url(#s-blue-grad)" />
    
    <!-- Scattered Pixels on left -->
    <g class="s-pixels">
      <rect x="65" y="150" width="8" height="8" rx="1.5" fill="#2563EB" />
      <rect x="80" y="135" width="6" height="6" rx="1" fill="#2563EB" />
      <rect x="85" y="160" width="10" height="10" rx="2" fill="#2563EB" />
      <rect x="55" y="170" width="6" height="6" rx="1" fill="#2563EB" />
      <rect x="70" y="185" width="8" height="8" rx="1.5" fill="#2563EB" />
      <rect x="95" y="180" width="5" height="5" rx="1" fill="#2563EB" />
    </g>

    <!-- Line graph top loop -->
    <g class="s-line-graph">
      <path d="M140,110 L165,90 L190,100 L215,75" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="140" cy="110" r="4" fill="#2563EB" />
      <circle cx="165" cy="90" r="4" fill="#2563EB" />
      <circle cx="190" cy="100" r="4" fill="#2563EB" />
      <circle cx="215" cy="75" r="5" fill="#EF4444" />
    </g>

    <!-- Bar chart bottom loop -->
    <g class="s-bar-chart">
      <rect x="125" y="210" width="10" height="35" rx="3" fill="url(#bar-g)" />
      <rect x="142" y="195" width="10" height="50" rx="3" fill="url(#bar-y)" />
      <rect x="159" y="180" width="10" height="65" rx="3" fill="url(#bar-r)" />
    </g>
  </g>
</svg>
