
<section id="mode-selector" class="py-3">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 text-center">

                        <h4 class="fw-bold mb-2">
                            Choose Mode
                        </h4>

                        <p class="text-muted mb-4">
                            Select how you would like to understand
                            your statistical results.
                        </p>

                        <div class="row g-3 justify-content-center">

                            <!-- Simple Mode -->
                            <div class="col-6 col-md-4">
                                <input
                                    type="radio"
                                    class="btn-check"
                                    name="interpretation-mode"
                                    id="simple-mode"
                                    value="simple"
                                    checked
                                >

                                <label
                                    class="btn btn-outline-primary w-100 p-3 rounded-3 text-center"
                                    for="simple-mode">

                                    <strong>Simple Mode</strong>

                                </label>
                            </div>

                            <!-- Learning Mode -->
                            <div class="col-6 col-md-4">
                                <input
                                    type="radio"
                                    class="btn-check"
                                    name="interpretation-mode"
                                    id="learning-mode"
                                    value="learning"
                                >

                                <label
                                    class="btn btn-outline-primary w-100 p-3 rounded-3 text-center"
                                    for="learning-mode">

                                    <strong>Learning Mode</strong>

                                </label>
                            </div>

                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>
