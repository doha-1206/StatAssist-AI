
<section id="research-question-section" class="py-3 d-none">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 text-center">

                        <h3 class="fw-bold mb-2">
                            Research Question
                        </h3>

                        <p class="text-muted mb-4">
                            What would you like to know about your dataset?
                        </p>

                        <textarea
                            id="research-question"
                            class="form-control text-start"
                            rows="4"
                            placeholder="Example: Is there a significant relationship between Age and Income?"
                        ></textarea>

                        <div class="text-center mt-4">

                            <button
                                id="btn-next-question"
                                class="btn btn-primary-blue px-4">

                                Analyze

                            </button>

                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<!-- Research Question Error Modal -->
<div
    class="modal fade"
    id="questionErrorModal"
    tabindex="-1"
    aria-labelledby="questionErrorTitle"
    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">

            <div class="modal-body text-center p-4">

                <div class="mb-3">
                    <i class="bi bi-exclamation-triangle-fill text-warning"
                       style="font-size: 42px;"></i>
                </div>

                <h5 class="fw-bold mb-3" id="questionErrorTitle">
                    Unsupported Research Question
                </h5>

                <p id="questionErrorMessage"
                   class="text-muted mb-4">
                </p>

                <button
                    type="button"
                    class="btn btn-primary-blue px-4"
                    data-bs-dismiss="modal">
                    OK
                </button>

            </div>

        </div>
    </div>
</div>
